<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Wrecked Lower Wobbleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm single column that reads like a case file, with a yellow highlighter accent and one colour per evidence file. */
:root {
  --ink: #14213d;
  --paper: #f4f6fb;
  --card: #ffffff;
  --line: #cfd7e8;
  --muted: #44516f;
  --tint: #e8edf8;
  --accent: #f2b705;
  --accent-ink: #241a00;
  --good: #166534;
  --good-bg: #e3f4e8;
  --bad: #991b1b;
  --bad-bg: #fbe7e7;
  --bar: #14213d;
  --bar-ink: #f4f6fb;
  --f1: #0f766e;
  --f2: #6d28d9;
  --f3: #c2410c;
  --f4: #be185d;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8edf8;
    --paper: #0d1424;
    --card: #162038;
    --line: #2c3b5e;
    --muted: #aebad6;
    --tint: #1d2a47;
    --good: #86efac;
    --good-bg: #12301f;
    --bad: #fca5a5;
    --bad-bg: #3a1717;
    --bar: #0a101d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8edf8;
  --paper: #0d1424;
  --card: #162038;
  --line: #2c3b5e;
  --muted: #aebad6;
  --tint: #1d2a47;
  --good: #86efac;
  --good-bg: #12301f;
  --bad: #fca5a5;
  --bad-bg: #3a1717;
  --bar: #0a101d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.65;
}
body.lock { overflow: hidden; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0 0 1rem; max-width: 68ch; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar { background: var(--bar); color: var(--bar-ink); }
.bar-inner { max-width: 820px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: 0.01em; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--bar-ink); display: flex; align-items: center; gap: 10px; text-align: left; }
.brand svg { flex: none; }
.bar .btn { background: transparent; color: var(--bar-ink); border-color: rgba(244, 246, 251, 0.45); min-height: 40px; padding: 6px 14px; }
.bar .btn:hover { background: rgba(244, 246, 251, 0.12); }

main { max-width: 820px; margin: 0 auto; padding: 36px 20px 96px; }

/* headings and text */
.hero { margin-bottom: 8px; }
.hero h1 { font-size: clamp(2.2rem, 7vw, 3.7rem); font-weight: 800; letter-spacing: -0.02em; }
.hero h1 .hl { background: linear-gradient(transparent 62%, var(--accent) 62%, var(--accent) 92%, transparent 92%); padding: 0 4px; margin: 0 -4px; }
.hero.small h1 { font-size: clamp(1.8rem, 5vw, 2.7rem); }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.lead { font-size: 1.2rem; margin-top: 18px; }
.block { margin-top: 48px; }
.block h2 { font-size: 1.55rem; margin-bottom: 14px; font-weight: 800; }
.block h3 { font-size: 1.15rem; margin: 22px 0 8px; }
.plain { margin: 0 0 1rem; padding-left: 1.2rem; max-width: 68ch; }
.plain li { margin-bottom: 6px; }
.crumbs { margin-bottom: 18px; }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.callout { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 10px; padding: 20px 22px; margin-top: 24px; }
.callout p:last-child { margin-bottom: 0; }
.block.callout { margin-top: 48px; }
.block.callout h2 { margin-bottom: 10px; }

/* numbered steps */
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 14px; max-width: 68ch; }
.steps li { counter-increment: s; position: relative; padding-left: 52px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 800; display: grid; place-items: center; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 22px; border-radius: 10px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-weight: 700; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--tint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: #ffc61f; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; }

/* case cards */
.cases { display: grid; gap: 14px; }
.casecard { display: flex; gap: 18px; align-items: flex-start; text-align: left; width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 18px 20px; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
.casecard:hover { border-color: var(--ink); transform: translateY(-2px); }
.casenum { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 800; font-size: 1.7rem; display: grid; place-items: center; }
.casebody { display: grid; gap: 4px; }
.level { font-family: var(--display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.casetitle { font-family: var(--display); font-weight: 800; font-size: 1.25rem; line-height: 1.2; }
.caseteaser { color: var(--muted); }

/* file cards */
.files { display: grid; gap: 14px; grid-template-columns: 1fr; margin: 18px 0 0; }
@media (min-width: 680px) { .files { grid-template-columns: 1fr 1fr; } }
.filecard { display: flex; gap: 16px; align-items: flex-start; text-align: left; background: var(--card); border: 2px solid var(--line); border-top: 8px solid var(--fc); border-radius: 4px 14px 14px 14px; padding: 16px 18px 18px; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
.filecard:hover { transform: translateY(-2px); border-color: var(--fc); }
.filenum { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--fc); color: #fff; font-family: var(--display); font-weight: 800; font-size: 1.5rem; display: grid; place-items: center; }
.filebody { display: grid; gap: 6px; }
.filename { font-family: var(--display); font-weight: 800; font-size: 1.1rem; line-height: 1.2; }
.fileabout { color: var(--muted); font-size: 0.97rem; line-height: 1.5; }
.f1 { --fc: var(--f1); } .f2 { --fc: var(--f2); } .f3 { --fc: var(--f3); } .f4 { --fc: var(--f4); }

/* file page */
.filepage { border-top: 10px solid var(--fc); margin: -36px -20px 0; padding: 28px 20px 0; }
@media (min-width: 860px) { .filepage { margin: -36px 0 0; padding-left: 0; padding-right: 0; } }
.filetop { margin-bottom: 22px; }
.bignum { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border-radius: 50%; background: var(--fc); color: #fff; font-size: 0.9em; vertical-align: 0.03em; margin-right: 6px; }

/* tables */
.tablewrap { overflow-x: auto; margin: 0 0 22px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
caption { text-align: left; font-family: var(--display); font-weight: 800; font-size: 1.05rem; padding: 14px 16px 10px; }
th, td { padding: 12px 16px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { background: var(--tint); font-size: 0.9rem; }
tbody th { font-weight: 400; min-width: 12rem; }
.num { text-align: right; white-space: nowrap; }
.total th, .total td { font-weight: 700; background: var(--tint); }
.blank { display: inline-block; padding: 2px 10px; border: 2px dashed var(--muted); border-radius: 6px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.tablenote { margin: -10px 0 22px; color: var(--muted); font-size: 0.97rem; }

/* witnesses */
.quote { margin: 0 0 18px; padding: 18px 22px; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--fc, var(--accent)); border-radius: 10px; max-width: 68ch; }
.quote blockquote { margin: 0 0 10px; font-size: 1.1rem; }
.quote figcaption { color: var(--muted); font-weight: 700; font-size: 0.95rem; }
.questions { padding-left: 1.3rem; max-width: 68ch; }
.questions li { margin-bottom: 14px; padding-left: 4px; }

/* team table options */
.step h2 { display: flex; align-items: center; gap: 14px; }
.stepno { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--display); }
.suspects, .clues, .remedies { display: grid; gap: 12px; margin: 18px 0 22px; }
.opt { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.opt:hover { border-color: var(--ink); }
.opt input { flex: none; width: 22px; height: 22px; margin: 3px 0 0; accent-color: var(--ink); }
.opt.picked { border-color: var(--ink); background: var(--tint); }
.opt.chosen { border-color: var(--good); background: var(--good-bg); }
.opt.ruled { opacity: 1; background: var(--bad-bg); border-color: var(--bad); cursor: default; }
.opt.dim { opacity: 0.55; cursor: not-allowed; }
.optbody { display: grid; gap: 4px; }
.optname { font-weight: 700; }
.term { font-weight: 400; color: var(--muted); }
.optdesc { color: var(--muted); font-size: 0.97rem; }
.ruledtext { margin-top: 8px; color: var(--ink); font-size: 0.97rem; }
.result { padding: 14px 18px; border-radius: 10px; margin: 16px 0; max-width: 68ch; }
.result.good { background: var(--good-bg); color: var(--good); border: 1px solid var(--good); }
.result.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
.counter { margin: 14px 0 0; }

/* verdict */
.verdict { position: relative; }
.stamp { display: inline-block; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; font-size: 1.1rem; color: var(--bad); border: 4px solid var(--bad); border-radius: 8px; padding: 6px 16px; transform: rotate(-4deg); margin-bottom: 22px; animation: stamp 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes stamp { from { transform: rotate(-4deg) scale(2.2); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } .casecard, .filecard { transition: none; } }
.culprit { font-size: 1.15rem; }
.review { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.review li { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 10px; padding: 14px 18px; display: grid; gap: 6px; }
.review li.good { border-left-color: var(--good); }
.review li.bad { border-left-color: var(--bad); }
.review li.missed { border-left-color: var(--accent); }
.status { font-weight: 700; font-size: 0.92rem; }
.review .good .status { color: var(--good); }
.review .bad .status { color: var(--bad); }
.cluetext { font-weight: 700; }
.why { color: var(--muted); font-size: 0.97rem; }

/* key words panel */
#panel { position: fixed; inset: 0; background: rgba(10, 16, 29, 0.6); display: flex; justify-content: flex-end; z-index: 20; }
#panel[hidden] { display: none; }
.panelbox { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--paper); color: var(--ink); padding: 22px 22px 48px; box-shadow: -8px 0 30px rgba(0, 0, 0, 0.3); }
.panelhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; position: sticky; top: -22px; background: var(--paper); padding: 22px 0 12px; }
.panelhead h2 { font-size: 1.6rem; }
.panelbox dt { font-family: var(--display); font-weight: 800; margin-top: 18px; }
.panelbox dd { margin: 4px 0 0; color: var(--muted); }
</style>
</head>
<body data-screen="home">
<header class="bar">
  <div class="bar-inner">
    <button class="brand" data-act="home" aria-label="Who Wrecked Lower Wobbleton, go to the start">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="#f2b705" stroke-width="3"/><line x1="15.8" y1="15.8" x2="23" y2="23" stroke="#f2b705" stroke-width="3.4" stroke-linecap="round"/></svg>
      <span>Who Wrecked Lower Wobbleton?</span>
    </button>
    <button class="btn" id="keywords-btn" type="button">Key words</button>
  </div>
</header>
<main id="app"></main>
<div id="panel" hidden></div>
<script>
const H = ["", "Two years ago", "Last year", "This year"];

const FILE_ROLES = {
  1: { name: "Jobs and Output", about: "Your file shows how many people have jobs, which industries are growing or shrinking, and how much the country is producing." },
  2: { name: "Prices and Spending", about: "Your file shows how prices are changing and how much households are spending." },
  3: { name: "Trade and Exchange Rates", about: "Your file shows what the country buys from abroad and sells abroad, and how its currency, the plonk, compares with other currencies." },
  4: { name: "Government and Banks", about: "Your file shows what the government and the Central Bank have been doing with taxes, spending, borrowing and interest rates." }
};

const SUSPECTS = [
  { id: "demandpull", name: "Too much spending", term: "Demand-pull inflation", desc: "People, firms and the government are spending faster than the country can produce, which pushes prices up." },
  { id: "costpush", name: "Rising costs of production", term: "Cost-push inflation", desc: "It has become dearer for firms to make things, so they raise their prices to cover the extra cost." },
  { id: "appreciation", name: "A stronger currency", term: "Currency appreciation", desc: "The country's money has become dearer in terms of other currencies, which makes its exports more expensive for foreign buyers." },
  { id: "foreignslump", name: "A recession abroad", term: "A fall in demand from trading partners", desc: "Customers in another country have less income, so they buy fewer of the goods the country sells to them." },
  { id: "structural", name: "Skills that no longer fit the jobs", term: "Structural unemployment", desc: "An industry has changed or closed, and the unemployed workers do not have the skills, or do not live where the new jobs are." },
  { id: "cuts", name: "Government cuts and tax rises", term: "Contractionary fiscal policy", desc: "The government has reduced its spending or raised taxes, which takes spending power out of the economy." }
];

const GLOSSARY = [
  ["Appreciation", "A rise in the price of a currency in terms of other currencies. If one plonk used to buy 1.00 krumb and now buys 1.50 krumbs, the plonk has appreciated."],
  ["Budget deficit", "The amount by which the government's spending is larger than the tax income it collects in a year. It is shown here as a percentage of national income."],
  ["Cost-push inflation", "A rise in prices caused by a rise in firms' costs of production, such as dearer energy or raw materials."],
  ["Demand-pull inflation", "A rise in prices caused by total spending in the economy growing faster than the economy is able to produce."],
  ["Exchange rate", "The price of one country's currency in terms of another's. In this game it is the number of krumbs that one plonk buys."],
  ["Exports and imports", "Exports are goods and services that a country sells to other countries. Imports are goods and services that it buys from other countries."],
  ["Index", "A way of showing change by setting a starting year equal to 100. An index of 91 means the figure has fallen by 9% since that year, and an index of 130 means it has risen by 30%."],
  ["Inflation", "The rate at which the general level of prices rises over a year."],
  ["Interest rate", "The price of borrowing money, shown as a percentage of the amount borrowed. A higher interest rate also gives savers and foreign depositors a better reward."],
  ["Multiplier effect", "When spending changes, total income changes by more than the original amount, because one person's spending is another person's income."],
  ["National income", "The total value of everything the country produces in a year. Government spending and the budget deficit are shown as a percentage of this figure."],
  ["Plonk and krumb", "The plonk is the money of Lower Wobbleton. The krumb is the money of Grumbria, the large neighbour that buys most of Lower Wobbleton's exports."],
  ["Recession", "A period in which the total output of an economy falls, usually with unemployment rising."],
  ["Red herring", "A clue that looks important but does not explain the problem. Some of the details in your files are red herrings, which means your team has to decide which ones matter."],
  ["Structural unemployment", "Unemployment that exists because the skills or locations of unemployed people do not match the jobs available, often after an industry closes or changes."],
  ["Trade surplus and deficit", "Exports minus imports. A positive figure is a surplus and a negative figure is a deficit."],
  ["Vacancy", "A job that an employer is trying to fill."]
];

const CASES = [
  /* ------------------------------------------------------------ CASE 1 */
  {
    id: 1,
    level: "Warm-up",
    title: "The Case of the Carnival Credit Cards",
    teaser: "Prices are racing upwards and it seems that everyone owns a yacht.",
    scene: "In Lower Wobbleton the Central Bank has made borrowing very cheap and the government has cut taxes. Shops are packed, builders are booked for years and almost everyone seems to own a yacht, although the island has only two lakes. Prices are now rising quickly, and your team has been asked to find out why.",
    headlines: [
      "Inflation has risen from 2% to 8% in two years.",
      "Unemployment is at its lowest level on record.",
      "The country is buying far more from abroad than it sells."
    ],
    culprit: "demandpull",
    files: {
      1: {
        tables: [
          { caption: "Unemployment and job vacancies", head: H, rows: [["Unemployment rate (%)", "5.0", "3.5", "2.2"], ["Job vacancies advertised", "4,000", "9,000", "14,000"]] },
          { caption: "Growth in the country's output", head: H, rows: [["Growth in output (% per year)", "2.5", "5.5", "6.5"], ["Fastest growth the country can safely keep up (% per year)", "3.0", "3.0", "3.0"]], note: "The last row shows how fast the country's factories, shops and workers can expand each year without running short of workers and materials." }
        ],
        witnesses: [{ name: "Brenda Haddock", role: "Builder", quote: "I cannot find a plasterer anywhere on the island. I offered one a company van, a bonus and a sausage supper, and he asked whether the sausage supper could be two sausage suppers." }],
        questions: [
          "Almost everyone who wants a job has one, and firms still cannot fill 14,000 vacancies. What do you think this does to the wages that firms have to offer?",
          "Output is growing faster than the safe rate shown in the second table. What problems could this cause?"
        ]
      },
      2: {
        tables: [
          { caption: "Inflation and spending", head: H, rows: [["Inflation (% per year)", "2.0", "5.0", "8.0"], ["Growth in household spending (% per year)", "3.0", "7.0", "9.0"], ["Share of income that households save (%)", "8", "5", "3"]] },
          { caption: "How much prices rose this year (%)", head: ["", "This year"], rows: [["Houses", "14"], ["Cars", "10"], ["Restaurant meals", "9"], ["Clothing", "7"], ["Energy (gas, electricity and fuel)", "3"]] }
        ],
        witnesses: [{ name: "Tobias Fennel", role: "Restaurant owner", quote: "Every table is booked for months. I put my prices up by ten percent and the bookings went up as well. I do not understand economics, but I am enjoying it very much." }],
        questions: [
          "Prices have risen in almost every category, including some that have little to do with energy or wages. What does this suggest about why firms feel able to raise their prices?",
          "Households are saving less and spending more. What has to be true for people to spend more than they used to?"
        ]
      },
      3: {
        tables: [
          { caption: "Trade with the rest of the world (millions of plonks per year)", head: H, rows: [["Exports", "800", "820", "840"], ["Imports", "700", "950", "1,150"], ["Surplus or deficit (exports minus imports)", "+100", "-130", "-310"]] },
          { caption: "Prices of imports (index, two years ago = 100)", head: H, rows: [["Imported oil and gas", "100", "100", "101"], ["Imported raw materials", "100", "101", "102"], ["Imported goods in the shops", "100", "101", "101"]] },
          { caption: "Exchange rate", head: H, rows: [["Krumbs bought by one plonk", "1.00", "1.00", "1.00"]] }
        ],
        witnesses: [{ name: "Gerald Pimm", role: "Customs officer", quote: "Ships bring in new yachts, cars and televisions every day. I have started to wonder whether the entire island is trying to buy one of everything." }],
        questions: [
          "The prices of imports have hardly changed, yet the amount imported has risen sharply. What does that tell you about how much people want to buy?",
          "What does the exchange rate table rule out as a cause of the problem?"
        ]
      },
      4: {
        tables: [
          { caption: "Interest rates and borrowing", head: H, rows: [["Central Bank interest rate (%)", "3.0", "1.0", "0.5"], ["Total borrowing by households (millions of plonks)", "400", "700", "1,150"]] },
          { caption: "Government taxes and spending", head: H, rows: [["Basic income tax rate (%)", "24", "24", "20"], ["Government spending (% of national income)", "30", "33", "36"], ["Budget deficit (% of national income)", "1", "3", "5"]] }
        ],
        witnesses: [{ name: "Sir Pelham Dunkley", role: "Governor of the Central Bank", quote: "I lowered interest rates because a cheerful economy seemed better than a gloomy one. I can now see that there is a limit to how much cheerfulness an island can hold." }],
        questions: [
          "Lower interest rates and lower income tax each change how much money people can spend and how much they want to spend. What effect would you expect from each?",
          "What does the growing budget deficit tell you about the government's own spending?"
        ]
      }
    },
    whyNot: {
      costpush: "Firms' costs have hardly moved. Import prices are up by about 1% and energy prices by only 3%, which means firms are raising prices because customers are willing to pay more, not because they are being forced to.",

      "<li><strong>Each detective opens a different evidence file,</strong> numbered 1 to 4. Every file holds different information, which means that no detective can solve the case alone.</li>" +
      "<li><strong>Read only your own file.</strong> Then explain to the rest of the team what you found, in your own words, because they cannot see your file.</li>" +
      "<li><strong>Discuss the evidence together.</strong> Some details are red herrings, which are clues that look important but do not explain the problem, so your team has to decide which facts really matter.</li>" +
      "<li><strong>Open the Team Table when you agree.</strong> One person enters the team's answers there: first who wrecked Lower Wobbleton, then the four clues that prove it, and finally what the government should do about it.</li></ol>" +
      '<div class="callout"><p><strong>Playing on one device?</strong> Each detective reads their file, presses Close my file, and passes the device to the next person.</p>' +
      "<p><strong>Playing on four devices?</strong> Each detective opens this page on their own device and chooses the same case. Only one person needs to use the Team Table.</p></div></section>";

    h += '<section class="block"><h2>Choose a case</h2><div class="cases">';
    CASES.forEach(function (c) {
      h += '<button class="casecard" data-act="open-case" data-case="' + c.id + '">' +
        '<span class="casenum">' + c.id + "</span>" +
        '<span class="casebody"><span class="level">' + esc(c.level) + "</span>" +
        '<span class="casetitle">' + esc(c.title) + "</span>" +
        '<span class="caseteaser">' + esc(c.teaser) + "</span></span></button>";
    });
    h += "</div></section>";
    return h;
  }

  function renderCase() {
    var c = caseById(S.caseId);
    var h = '<nav class="crumbs"><button class="linkbtn" data-act="home">All cases</button></nav>' +
      '<section class="hero small"><p class="eyebrow">Case ' + c.id + " · " + esc(c.level) + "</p><h1>" + esc(c.title) + "</h1></section>";
    h += '<section class="block"><h2>The scene</h2><p>' + esc(c.scene) + "</p>" +
      '<h3>What has gone wrong</h3><ul class="plain">';
    c.headlines.forEach(function (x) { h += "<li>" + esc(x) + "</li>"; });
    h += "</ul></section>";

    h += '<section class="block"><h2>Choose your file</h2>' +
      "<p>Each detective chooses a different file and reads only that one. Your team needs all four files to solve the case, so it is a good idea to agree who takes which number before anyone opens a file.</p>" +
      '<div class="files">';
    [1, 2, 3, 4].forEach(function (n) {
      h += '<button class="filecard f' + n + '" data-act="open-file" data-file="' + n + '">' +
        '<span class="filenum">' + n + "</span>" +
        '<span class="filebody"><span class="filename">File ' + n + ": " + esc(FILE_ROLES[n].name) + "</span>" +
        '<span class="fileabout">' + esc(FILE_ROLES[n].about) + "</span></span></button>";
    });
    h += "</div></section>";

    h += '<section class="block"><h2>When your team is ready</h2>' +
      "<p>Open the Team Table once every detective has explained their file to the others and the team has discussed what it all means. You can come back to your files from the Team Table at any time.</p>" +
      '<button class="btn primary" data-act="open-team">Open the Team Table</button></section>';
    return h;
  }

  function renderFile() {
    var c = caseById(S.caseId), n = S.fileId, f = c.files[n], role = FILE_ROLES[n];
    var h = '<div class="filepage f' + n + '">' +
      '<div class="filetop"><button class="btn" data-act="close-file">Close my file</button></div>' +
      '<section class="hero small"><p class="eyebrow">' + esc(c.title) + '</p><h1><span class="bignum">' + n + "</span> " + esc(role.name) + "</h1>" +
      '<p class="lead">You are the detective for this file. ' + esc(role.about) + "</p></section>";

    h += '<section class="block"><h2>The figures</h2>';
    f.tables.forEach(function (t) { h += table(t); });
    h += "</section>";

    h += '<section class="block"><h2>' + (f.witnesses.length > 1 ? "What people told you" : "What a witness told you") + "</h2>";
    f.witnesses.forEach(function (w) {
      h += '<figure class="quote"><blockquote>' + esc(w.quote) + "</blockquote><figcaption>" + esc(w.name) + ", " + esc(w.role.charAt(0).toLowerCase() + w.role.slice(1)) + "</figcaption></figure>";
    });
    h += "</section>";

    h += '<section class="block"><h2>Questions to think about</h2><ol class="questions">';
    f.questions.forEach(function (q) { h += "<li>" + esc(q) + "</li>"; });
    h += "</ol></section>";

    h += '<section class="block callout"><h2>What to do next</h2>' +
      "<p>Tell the rest of your team what you found, using your own words, because they cannot see this file. Listen to what they found in theirs as well, since the explanation for the problem needs facts from all four files.</p>" +
      '<button class="btn primary" data-act="close-file">Close my file</button></section></div>';
    return h;
  }

  function renderTeam() {
    var c = caseById(S.caseId), t = S.team;
    var h = '<nav class="crumbs"><button class="linkbtn" data-act="back-case">Back to the case and the files</button></nav>' +
      '<section class="hero small"><p class="eyebrow">Team Table · ' + esc(c.title) + "</p><h1>Make your accusation</h1>" +
      '<p class="lead">Choose one person to enter the team\'s answers. Before you answer, make sure that every detective has explained what is in their file.</p></section>';

    /* Step 1 */
    h += '<section class="block step"><h2><span class="stepno">1</span> Who wrecked Lower Wobbleton?</h2>';
    if (t.solved) {
      var cs = suspectById(c.culprit);
      h += '<div class="result good" role="status"><strong>Correct.</strong> The culprit is <strong>' + esc(cs.name.toLowerCase()) + "</strong> (" + esc(cs.term.toLowerCase()) + ").</div>";
    } else {
      h += "<p>Choose the suspect that best explains what has gone wrong. You can change your answer if you are wrong, although your score is higher when you accuse correctly at the first attempt.</p>";
    }
    h += '<div class="suspects" role="radiogroup" aria-label="Suspects">';
    SUSPECTS.forEach(function (s) {
      var ruled = t.ruled.indexOf(s.id) >= 0;
      var isCulprit = t.solved && s.id === c.culprit;
      var dis = ruled || t.solved;
      h += '<label class="opt suspect' + (ruled ? " ruled" : "") + (isCulprit ? " chosen" : "") + (t.pick === s.id ? " picked" : "") + '" for="sus-' + s.id + '">' +
        '<input type="radio" name="suspect" id="sus-' + s.id + '" value="' + s.id + '"' + (t.pick === s.id ? " checked" : "") + (dis ? " disabled" : "") + ' data-act="pick-suspect">' +
        '<span class="optbody"><span class="optname">' + esc(s.name) + ' <span class="term">(' + esc(s.term) + ")</span></span>" +
        '<span class="optdesc">' + esc(s.desc) + "</span>";
      if (ruled) { h += '<span class="ruledtext"><strong>Ruled out.</strong> ' + esc(c.whyNot[s.id]) + "</span>"; }
      h += "</span></label>";
    });
    h += "</div>";
    if (!t.solved) {
      if (t.notice) { h += '<div class="result bad" role="status">' + esc(t.notice) + "</div>"; }
      h += '<button class="btn primary" data-act="accuse"' + (t.pick ? "" : " disabled") + ">Make the accusation</button>";
    }
    h += "</section>";

    /* Step 2 */
    if (t.solved) {
      h += '<section class="block step"><h2><span class="stepno">2</span> Which four clues prove it?</h2>' +
        "<p>Some of these clues are true but do not prove your accusation. Choose the four that best prove who wrecked Lower Wobbleton. The label under each clue shows which file it came from.</p>" +
        '<p class="counter" role="status" aria-live="polite"><strong>' + t.clues.length + " of 4</strong> clues chosen</p>" +
        '<div class="clues">';
      t.clueOrder.forEach(function (id) {
        var cl = c.clues.filter(function (x) { return x.id === id; })[0];
        var on = t.clues.indexOf(id) >= 0;
        var dis = !on && t.clues.length >= 4;
        h += '<label class="opt clue' + (on ? " picked" : "") + (dis ? " dim" : "") + '" for="clue-' + id + '">' +
          '<input type="checkbox" id="clue-' + id + '" value="' + id + '"' + (on ? " checked" : "") + (dis ? " disabled" : "") + ' data-act="pick-clue">' +
          '<span class="optbody"><span class="optname">' + esc(cl.text) + '</span><span class="optdesc">From ' + esc(fileTag(cl.from)) + "</span></span></label>";
      });
      h += "</div></section>";
    }

    /* Step 3 */
    if (t.solved && t.clues.length === 4) {
      h += '<section class="block step"><h2><span class="stepno">3</span> What should the government do?</h2>' +
        "<p>Choose the response that deals best with the cause you have identified.</p>" +
        '<div class="remedies" role="radiogroup" aria-label="Responses">';
      t.remedyOrder.forEach(function (i) {
        var r = c.remedies[i];
        h += '<label class="opt remedy' + (t.remedy === i ? " picked" : "") + '" for="rem-' + i + '">' +
          '<input type="radio" name="remedy" id="rem-' + i + '" value="' + i + '"' + (t.remedy === i ? " checked" : "") + ' data-act="pick-remedy">' +
          '<span class="optbody"><span class="optname">' + esc(r.text) + "</span></span></label>";
      });
      h += '</div><button class="btn primary" data-act="close-case"' + (t.remedy === null ? " disabled" : "") + ">Close the case</button></section>";
    }
    return h;
  }

  function rank(score) {
    if (score >= 9) { return "Chief Inspector"; }
    if (score >= 7) { return "Detective Inspector"; }
    if (score >= 5) { return "Sergeant"; }
    return "Trainee detective";
  }
  function rankLine(score) {
    if (score >= 9) { return "Your team found the culprit and the evidence, and chose a response that tackles the cause."; }
    if (score >= 7) { return "Your team solved the case, with a few details to improve."; }
    if (score >= 5) { return "Your team found its way to the answer, and the explanations below show where the evidence was stronger than it first looked."; }
    return "Read the explanations below and replay the case, because the second attempt usually goes much better.";
  }

  function renderVerdict() {
    var c = caseById(S.caseId), t = S.team;
    var keyChosen = t.clues.filter(function (id) { return c.clues.filter(function (x) { return x.id === id; })[0].key; }).length;
    var rem = c.remedies[t.remedy];
    var total = t.culpritPts + keyChosen + rem.pts;
    var cs = suspectById(c.culprit);

    var h = '<section class="hero small verdict"><div class="stamp" aria-hidden="true">Case closed</div>' +
      '<p class="eyebrow">' + esc(c.title) + "</p><h1>" + total + " out of 10</h1>" +
      '<p class="lead"><strong>' + rank(total) + ".</strong> " + rankLine(total) + "</p></section>";

    h += '<section class="block"><h2>Your score</h2><div class="tablewrap"><table><caption class="sr">Score breakdown</caption><thead><tr><th scope="col">Part of the case</th><th scope="col" class="num">Your score</th><th scope="col" class="num">Highest possible</th></tr></thead><tbody>' +
      '<tr><th scope="row">Accusation (' + (t.attempts === 0 ? "correct at the first attempt" : "correct after " + (t.attempts + 1) + " attempts") + ')</th><td class="num">' + t.culpritPts + '</td><td class="num">4</td></tr>' +
      '<tr><th scope="row">Clues (' + keyChosen + " of the 4 strongest chosen)</th><td class=\"num\">" + keyChosen + '</td><td class="num">4</td></tr>' +
      '<tr><th scope="row">Government response</th><td class="num">' + rem.pts + '</td><td class="num">2</td></tr>' +
      '<tr class="total"><th scope="row">Total</th><td class="num">' + total + '</td><td class="num">10</td></tr></tbody></table></div></section>';

    h += '<section class="block"><h2>What happened in Lower Wobbleton</h2><p class="culprit"><strong>' + esc(cs.name) + "</strong> (" + esc(cs.term.toLowerCase()) + ")</p><p>" + esc(c.explanation) + "</p></section>";

    h += '<section class="block"><h2>Your clues</h2><ul class="review">';
    t.clueOrder.forEach(function (id) {
      var cl = c.clues.filter(function (x) { return x.id === id; })[0];
      var on = t.clues.indexOf(id) >= 0;
      var label, cls;
      if (on && cl.key) { label = "You chose this, and it is one of the four strongest clues."; cls = "good"; }
      else if (on) { label = "You chose this, but it does not prove the accusation."; cls = "bad"; }
      else if (cl.key) { label = "You did not choose this, and it is one of the four strongest clues."; cls = "missed"; }
      else { label = "You did not choose this, which was reasonable because it does not prove the accusation."; cls = "neutral"; }
      h += '<li class="' + cls + '"><span class="status">' + esc(label) + '</span><span class="cluetext">' + esc(cl.text) + '</span><span class="why">' + esc(cl.why) + "</span></li>";
    });
    h += "</ul></section>";

    var best = c.remedies.filter(function (r) { return r.pts === 2; })[0];
    h += '<section class="block"><h2>The government\'s response</h2>' +
      '<p><strong>You chose:</strong> ' + esc(rem.text) + "</p><p>" + esc(rem.why) + "</p>";
    if (rem.pts < 2) { h += '<p><strong>The strongest response was:</strong> ' + esc(best.text) + "</p><p>" + esc(best.why) + "</p>"; }
    h += "</section>";

    h += '<section class="block actions"><button class="btn primary" data-act="replay">Play this case again</button>' +
      '<button class="btn" data-act="home">Choose another case</button></section>';
    return h;
  }

  /* ---------- key words panel ---------- */
  function openPanel() {
    lastFocusBeforePanel = document.activeElement;
    var h = '<div class="panelbox" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panelhead"><h2 id="panel-title">Key words</h2><button class="btn" id="panel-close" data-act="close-panel">Close</button></div><dl>';
    GLOSSARY.forEach(function (g) { h += "<dt>" + esc(g[0]) + "</dt><dd>" + esc(g[1]) + "</dd>"; });
    h += "</dl></div>";
    panelEl.innerHTML = h;
    panelEl.hidden = false;
    document.body.classList.add("lock");
    var b = document.getElementById("panel-close");
    if (b) { b.focus(); }
  }
  function closePanel() {
    panelEl.hidden = true;
    panelEl.innerHTML = "";
    document.body.classList.remove("lock");
    if (lastFocusBeforePanel && lastFocusBeforePanel.focus) { lastFocusBeforePanel.focus(); }
  }

  /* ---------- main render ---------- */
  function render(scrollTop) {
    var activeId = document.activeElement && document.activeElement.id;
    var y = window.scrollY;
    var html;
    if (S.screen === "case") { html = renderCase(); }
    else if (S.screen === "file") { html = renderFile(); }
    else if (S.screen === "team") { html = renderTeam(); }
    else if (S.screen === "verdict") { html = renderVerdict(); }
    else { html = renderHome(); }
    app.innerHTML = html;
    document.body.setAttribute("data-screen", S.screen);
    if (scrollTop) { window.scrollTo(0, 0); }
    else {
      window.scrollTo(0, y);
      if (activeId) { var el = document.getElementById(activeId); if (el && el.focus) { el.focus({ preventScroll: true }); } }
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) { return; }
    var act = el.getAttribute("data-act");
    if (act === "pick-suspect" || act === "pick-clue" || act === "pick-remedy") { return; }
    if (el.disabled) { return; }
    var t = S.team;
    if (act === "open-panel") { openPanel(); }
    else if (act === "close-panel") { closePanel(); }
    else if (act === "home") { go("home", { caseId: null, fileId: null }); }
    else if (act === "open-case") { go("case", { caseId: +el.getAttribute("data-case"), fileId: null }); }
    else if (act === "open-file") { go("file", { fileId: +el.getAttribute("data-file") }); }
    else if (act === "close-file" || act === "back-case") { go("case", { fileId: null }); }
    else if (act === "open-team") {
      if (!S.team || S.team.caseId !== S.caseId) { S.team = newTeam(S.caseId); }
      go("team", {});
    }
    else if (act === "accuse") {
      var c = caseById(S.caseId);
      if (!t.pick) { return; }
      if (t.pick === c.culprit) {
        t.solved = true;
        t.culpritPts = t.attempts === 0 ? 4 : (t.attempts === 1 ? 2 : 1);
        t.notice = "";
      } else {
        t.ruled.push(t.pick);
        t.attempts += 1;
        t.pick = null;
        t.notice = "That suspect does not fit the evidence. The reason is shown on the card that is now marked Ruled out. Read it, discuss it with your team and try again.";
      }
      render(false);
    }
    else if (act === "close-case") {
      if (t.remedy === null) { return; }
      go("verdict", {});
    }
    else if (act === "replay") { S.team = newTeam(S.caseId); go("case", { fileId: null }); }
  });

  document.addEventListener("change", function (e) {
    var el = e.target;
    var act = el.getAttribute && el.getAttribute("data-act");
    var t = S.team;
    if (act === "pick-suspect") { t.pick = el.value; t.notice = ""; render(false); }
    else if (act === "pick-clue") {
      var i = t.clues.indexOf(el.value);
      if (el.checked && i < 0 && t.clues.length < 4) { t.clues.push(el.value); }
      else if (!el.checked && i >= 0) { t.clues.splice(i, 1); }
      if (t.clues.length < 4) { t.remedy = null; }
      render(false);
    }
    else if (act === "pick-remedy") { t.remedy = +el.value; render(false); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panelEl.hidden) { closePanel(); }
    if (e.key === "Tab" && !panelEl.hidden) {
      var f = panelEl.querySelectorAll("button");
      if (f.length) { e.preventDefault(); f[0].focus(); }
    }
  });

  document.getElementById("keywords-btn").addEventListener("click", openPanel);
  panelEl.addEventListener("click", function (e) { if (e.target === panelEl) { closePanel(); } });

  /* ---------- start ---------- */
  function start(saved) {
    if (saved && saved.screen) { S = saved; }
    else { var h = fromHash(); if (h) { S = h; } }
    render(false);
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return S; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
})();

</script>
</body>
</html>
